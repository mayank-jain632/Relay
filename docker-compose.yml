version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: contexthud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contexthud
    ports:
      - "5432:5432"
    volumes:
      - contexthud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contexthud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contexthud_pgdata:
